<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Giỏ hàng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h2 class="mb-4">Giỏ hàng của bạn</h2>

  <form th:action="@{/updateCart}" method="post">
    <table class="table table-bordered">
      <thead class="table-light">
      <tr>
        <th>Sản phẩm</th>
        <th>Hình ảnh</th>
        <th>Đơn giá</th>
        <th>Số lượng</th>
        <th>Thành tiền</th>
        <th>Hành động</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="obj : ${cartitems}">
        <td th:text="${obj.productname}">Tên sản phẩm</td>
        <td> <img th:src="@{/img/{imageName}(imageName=${obj.image})}" alt="News Image"
                  width= "60"></td>
        <td th:text="${obj.price}">Giá</td>
        <td>
          <input type="number" th:value="${obj.quantity}" name="quantity" min="1">
        </td>
        <td th:text="${obj.total}">Tổng</td>
        <td>
          <a th:href="@{/removeCart/{id}(id=${obj.id})}" class="btn btn-danger btn-sm">Xóa</a>
        </td>

      </tr>
      </tbody>
    </table>

    <p>Tổng cộng: <span th:text="${totalCart}"></span></p>
    <button type="submit" class="btn btn-primary">Cập nhật giỏ hàng</button>
    <a href="/product">Quay lại các sản phẩm</a>
  </form>
</div>
</body>
</html>
